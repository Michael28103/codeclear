services:
  hapi:
    image: hapiproject/hapi:v7.4.0
    ports:
      - "8080:8080"
    environment:
      hapi.fhir.fhir_version: R4

  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    restart: always
    environment:
      POSTGRES_USER: codeclear
      POSTGRES_PASSWORD: codeclear
      POSTGRES_DB: codeclear
    volumes:
      - pgdata:/var/lib/postgresql/data

  synthea:
    build: docker/synthea
    profiles: ["tools"]
    user: "1000:1000"
    volumes:
      - ./data:/data
    command:
      - "-p"
      - "50"
      - "-s"
      - "42"
      - "--exporter.baseDirectory=/data/synthea"
      - "--exporter.fhir.export=true"
      - "--exporter.hospital.fhir.export=true"
      - "--exporter.practitioner.fhir.export=true"

volumes:
  pgdata: